# Data plane de UN cliente (D-016, D-024). Mismo archivo para todos los clientes;
# lo que cambia es el nombre de proyecto y el archivo de entorno privado:
#
#   docker compose -p fa-<clave> -f deploy/tenant/compose.yaml \
#       --env-file config/tenants/private/<CLAVE>.env up -d
#
# Docker antepone el nombre de proyecto al volumen y a la red, así que cada cliente
# tiene base, volumen y red propios. No lo ejecute a mano: use
#   python -m app.plataforma.tenants alta ...
# que además crea los roles, aplica migraciones, registra el cliente y verifica el aislamiento.
#
# En el servidor, el backend y los workers del cliente se agregan a este mismo
# proyecto (fase 7). En desarrollo corren en el equipo con `tenants servir`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: facturas
      # Superusuario sólo para aprovisionar; la app nunca lo usa.
      POSTGRES_USER: dp_admin
      POSTGRES_PASSWORD: ${DP_ADMIN_PASSWORD:?Falta DP_ADMIN_PASSWORD en el entorno del cliente}
    ports:
      - "127.0.0.1:${DP_DB_PORT:?Falta DP_DB_PORT en el entorno del cliente}:5432"
    volumes:
      - datos:/var/lib/postgresql/data
    networks: [dataplane]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dp_admin -d facturas"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  datos:

networks:
  dataplane:
