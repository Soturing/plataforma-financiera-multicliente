services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-facturas_demo}
      POSTGRES_USER: ${POSTGRES_USER:-facturas_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/10-initial-schema.sql:ro
      - ./db/migrations/002_upload_batches.sql:/docker-entrypoint-initdb.d/11-upload-batches.sql:ro
      - ./db/migrations/003_document_classification.sql:/docker-entrypoint-initdb.d/12-document-classification.sql:ro
      - ./db/migrations/004_review_model_v02.sql:/docker-entrypoint-initdb.d/13-review-model-v02.sql:ro
      - ./db/migrations/005_internal_receipts.sql:/docker-entrypoint-initdb.d/14-internal-receipts.sql:ro
      - ./db/migrations/006_document_numbers.sql:/docker-entrypoint-initdb.d/15-document-numbers.sql:ro
      - ./db/migrations/007_branch_recognition.sql:/docker-entrypoint-initdb.d/16-branch-recognition.sql:ro
      - ./db/migrations/008_expense_documents.sql:/docker-entrypoint-initdb.d/17-expense-documents.sql:ro
      - ./db/migrations/009_provider_learning.sql:/docker-entrypoint-initdb.d/18-provider-learning.sql:ro
      - ./db/migrations/010_financial_structure.sql:/docker-entrypoint-initdb.d/19-financial-structure.sql:ro
      - ./db/migrations/011_sales_breakdown.sql:/docker-entrypoint-initdb.d/21-sales-breakdown.sql:ro
      - ./db/migrations/012_operational_branches.sql:/docker-entrypoint-initdb.d/22-operational-branches.sql:ro
      - ./db/migrations/013_consumption_branch_inference.sql:/docker-entrypoint-initdb.d/23-consumption-branch-inference.sql:ro
      - ./db/migrations/014_migrate_demo_pending_to_unassigned.sql:/docker-entrypoint-initdb.d/24-migrate-demo-pending.sql:ro
      - ./db/migrations/015_raise_internal_receipt_limit.sql:/docker-entrypoint-initdb.d/25-raise-receipt-limit.sql:ro
      - ./db/migrations/016_fixed_expense_periodification.sql:/docker-entrypoint-initdb.d/26-fixed-expense-periodification.sql:ro
      - ./db/migrations/017_single_internal_receipt_approval.sql:/docker-entrypoint-initdb.d/27-single-receipt-approval.sql:ro
      - ./db/migrations/018_editable_expense_flag.sql:/docker-entrypoint-initdb.d/28-editable-expense-flag.sql:ro
      - ./db/migrations/019_document_duplicates.sql:/docker-entrypoint-initdb.d/29-document-duplicates.sql:ro
      - ./db/migrations/020_backfill_document_duplicates.sql:/docker-entrypoint-initdb.d/30-backfill-document-duplicates.sql:ro
      - ./db/migrations/021_document_deletion_and_cancellation.sql:/docker-entrypoint-initdb.d/31-document-deletion-and-cancellation.sql:ro
      - ./db/migrations/022_weekly_report_expenses.sql:/docker-entrypoint-initdb.d/32-weekly-report-expenses.sql:ro
      - ./db/migrations/023_estimated_fixed_expenses.sql:/docker-entrypoint-initdb.d/33-estimated-fixed-expenses.sql:ro
      - ./db/migrations/024_expense_categories_v2.sql:/docker-entrypoint-initdb.d/34-expense-categories-v2.sql:ro
      - ./db/migrations/025_fixed_expense_list.sql:/docker-entrypoint-initdb.d/35-fixed-expense-list.sql:ro
      - ./db/migrations/026_sales_commissions.sql:/docker-entrypoint-initdb.d/36-sales-commissions.sql:ro
      - ./db/migrations/027_manual_payroll.sql:/docker-entrypoint-initdb.d/37-manual-payroll.sql:ro
      - ./db/migrations/028_document_type_quotation.sql:/docker-entrypoint-initdb.d/38-document-type-quotation.sql:ro
      - ./db/migrations/029_own_entities.sql:/docker-entrypoint-initdb.d/39-own-entities.sql:ro
      - ./db/migrations/030_ocr_job_queue.sql:/docker-entrypoint-initdb.d/40-ocr-job-queue.sql:ro
      - ./db/migrations/031_document_page_groups.sql:/docker-entrypoint-initdb.d/41-document-page-groups.sql:ro
      - ./db/migrations/032_restaurantes.sql:/docker-entrypoint-initdb.d/42-restaurantes.sql:ro
      - ./db/migrations/033_rls_tenant_sucursal.sql:/docker-entrypoint-initdb.d/43-rls-tenant-sucursal.sql:ro
      - ./db/seeds/001_demo_catalogs.sql:/docker-entrypoint-initdb.d/20-demo-catalogs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-facturas_app} -d ${POSTGRES_DB:-facturas_demo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Plano de control: proveedor de identidad (D-021). Se levanta con
  # `docker compose --profile identidad up -d`. Red propia, sin ruta hacia la
  # base de negocio; sólo el puerto HTTP local queda expuesto en 127.0.0.1.
  identidad-postgres:
    profiles: ["identidad"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${IDENTIDAD_DB_PASSWORD:?Define IDENTIDAD_DB_PASSWORD en el archivo .env local}
    volumes:
      - identidad_postgres_data:/var/lib/postgresql/data
    networks: [control]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  identidad:
    profiles: ["identidad"]
    image: quay.io/keycloak/keycloak:26.7.5
    # start-dev sólo para el entorno local: HTTP en localhost (contexto seguro
    # para WebAuthn). Producción usa `start` con TLS detrás del proxy inverso.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identidad-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${IDENTIDAD_DB_PASSWORD}
      KC_HOSTNAME: http://localhost:${IDENTIDAD_PORT:-8180}
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${IDENTIDAD_ADMIN_USER:-instalacion}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${IDENTIDAD_ADMIN_PASSWORD:?Define IDENTIDAD_ADMIN_PASSWORD en el archivo .env local}
      FACTURAS_OIDC_CLIENT_SECRET: ${FACTURAS_OIDC_CLIENT_SECRET:?Define FACTURAS_OIDC_CLIENT_SECRET en el archivo .env local}
      FACTURAS_IDP_ADMIN_CLIENT_SECRET: ${FACTURAS_IDP_ADMIN_CLIENT_SECRET:?Define FACTURAS_IDP_ADMIN_CLIENT_SECRET en el archivo .env local}
      FACTURAS_APP_URL: ${FACTURAS_APP_URL:-http://localhost:8000}
      IDENTIDAD_SMTP_HOST: ${IDENTIDAD_SMTP_HOST:-correo-pruebas}
      IDENTIDAD_SMTP_PORT: ${IDENTIDAD_SMTP_PORT:-1025}
      IDENTIDAD_SMTP_FROM: ${IDENTIDAD_SMTP_FROM:-accesos@facturas.localhost}
    volumes:
      - ./deploy/identidad/realm-facturas.json:/opt/keycloak/data/import/realm-facturas.json:ro
    ports:
      - "127.0.0.1:${IDENTIDAD_PORT:-8180}:8080"
    networks: [control]
    depends_on:
      identidad-postgres:
        condition: service_healthy

  # Plano de control: identidades, asignaciones, sesiones y auditoría (fase 2).
  # Base propia, separada de la de negocio y de la del proveedor de identidad.
  control-postgres:
    profiles: ["identidad"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: facturas_control
      POSTGRES_USER: control_owner
      POSTGRES_PASSWORD: ${CONTROL_OWNER_PASSWORD:?Define CONTROL_OWNER_PASSWORD en el archivo .env local}
      CONTROL_APP_PASSWORD: ${CONTROL_APP_PASSWORD:?Define CONTROL_APP_PASSWORD en el archivo .env local}
    ports:
      - "127.0.0.1:${CONTROL_POSTGRES_PORT:-5436}:5432"
    volumes:
      - control_postgres_data:/var/lib/postgresql/data
      - ./db/control/000_roles.sh:/docker-entrypoint-initdb.d/000_roles.sh:ro
      - ./db/control/001_control_plane.sql:/docker-entrypoint-initdb.d/001_control_plane.sql:ro
      - ./db/control/002_restaurantes_pivote.sql:/docker-entrypoint-initdb.d/002_restaurantes_pivote.sql:ro
    networks: [control]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_owner -d facturas_control"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Sólo desarrollo: captura los correos de invitación para leerlos en
  # http://localhost:8025 y desde las pruebas. Nunca envía correo real.
  correo-pruebas:
    profiles: ["identidad"]
    image: axllent/mailpit:v1.31.3
    ports:
      - "127.0.0.1:${CORREO_PRUEBAS_PORT:-8025}:8025"
    networks: [control]

networks:
  control:

volumes:
  postgres_data:
  identidad_postgres_data:
  control_postgres_data:
